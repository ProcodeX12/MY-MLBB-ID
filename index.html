<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLBB Profile</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1020;
      font-family: Arial, sans-serif;
      color: white;
      padding: 20px;
    }

    .profile {
      width: 100%;
      max-width: 360px;
      background: #151d32;
      border: 1px solid #344361;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 15px 40px #0006;
    }

    .header {
      padding: 25px 20px;
      text-align: center;
      background: linear-gradient(135deg, #172b50, #245a91);
    }

    .header h1 {
      font-size: 22px;
      letter-spacing: 2px;
    }

    .header p {
      margin-top: 8px;
      font-size: 12px;
      color: #c5d9f5;
      letter-spacing: 3px;
    }

    .content {
      padding: 25px 22px;
    }

    .label {
      font-size: 11px;
      color: #8fa8ce;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .value {
      font-size: 17px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .item {
      padding: 15px 0;
      border-bottom: 1px solid #293650;
    }

    .item:last-child {
      border-bottom: none;
    }

    .footer {
      text-align: center;
      padding: 15px;
      font-size: 10px;
      letter-spacing: 2px;
      color: #7187a9;
      background: #10182a;
    }
  </style>
</head>

<body>
  <div class="profile">
    <div class="header">
      <h1>MOBILE LEGENDS</h1>
      <p>BANG BANG</p>
    </div>

    <div class="content">
      <div class="item">
        <div class="label">USERNAME</div>
        <div class="value">WALA HAHA</div>
      </div>

      <div class="item">
        <div class="label">PLAYER ID</div>
        <div class="value">1409841941</div>
      </div>

      <div class="item">
        <div class="label">SERVER ID</div>
        <div class="value">14237</div>
      </div>
    </div>

    <div class="footer">
      MLBB PLAYER PROFILE
    </div>
  </div>
</body>
</html>
